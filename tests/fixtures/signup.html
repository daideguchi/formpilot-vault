<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sample Signup</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #eef2f6;
        color: #1f2933;
      }
      main {
        max-width: 720px;
        margin: 28px auto;
        padding: 24px;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 14px 40px rgba(31, 41, 51, 0.12);
      }
      h1 {
        margin: 0 0 18px;
        font-size: 24px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      label {
        display: grid;
        gap: 5px;
        font-size: 13px;
        font-weight: 700;
      }
      input,
      select {
        min-height: 38px;
        border: 1px solid #c7d0dd;
        border-radius: 7px;
        padding: 8px 10px;
        font: inherit;
      }
      .wide {
        grid-column: 1 / -1;
      }
      button {
        margin-top: 18px;
        min-height: 40px;
        border: 0;
        border-radius: 7px;
        padding: 0 18px;
        background: #0f766e;
        color: #fff;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>無料トライアル登録</h1>
      <form>
        <div class="grid">
          <label>姓 <input id="lastName" name="last_name" autocomplete="family-name" required></label>
          <label>名 <input id="firstName" name="first_name" autocomplete="given-name" required></label>
          <label>セイ <input id="lastKana" name="last_kana" placeholder="ヤマダ" required></label>
          <label>メイ <input id="firstKana" name="first_kana" placeholder="タロウ" required></label>
          <label class="wide">メールアドレス <input id="email" type="email" name="email" autocomplete="email" required></label>
          <label>電話番号 <input id="phone" type="tel" name="phone" placeholder="090-1234-5678"></label>
          <label>郵便番号 <input id="postal" name="postal_code" placeholder="150-0001" autocomplete="postal-code"></label>
          <label>都道府県
            <select id="prefecture" name="prefecture" autocomplete="address-level1">
              <option value="">選択してください</option>
              <option value="東京都">東京都</option>
              <option value="神奈川県">神奈川県</option>
              <option value="大阪府">大阪府</option>
            </select>
          </label>
          <label class="wide">住所 <input id="address" name="address" autocomplete="street-address"></label>
          <label>会社名 <input id="company" name="company"></label>
          <label>役職 <input id="title" name="position"></label>
          <label>会員ID <input id="memberId" name="member_id"></label>
          <label class="wide">招待コード <input id="referralCode" name="invite_code"></label>
          <label class="wide">パスワード <input id="password" type="password" name="password"></label>
        </div>
        <button type="button">確認して送信</button>
      </form>
    </main>
  </body>
</html>
