name = "ai-form-autofill"
main = "api/worker/worker.mjs"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "ai-form-autofill-prod"
database_id = "895767fa-8bc7-4811-9801-63d879eeb194"
migrations_dir = "api/worker/migrations"

[vars]
AFA_SCHEMA_PROXY_MODE = "live"
AFA_SCHEMA_PROVIDER_ID = "cloudflare_workers_ai_free"
ENTITLEMENT_SOURCE = "d1"
PUBLIC_SITE_URL = "https://formpilot-vault-api.vercel.app"
CLOUDFLARE_WORKERS_AI_MODEL = "@cf/meta/llama-3.2-3b-instruct"
CLOUDFLARE_WORKERS_AI_FALLBACK_MODEL = "@cf/zai-org/glm-4.7-flash"
STRIPE_PLAN_PRICE_MAP = "{\"plus\":\"price_plus\",\"pro\":\"price_pro\",\"team\":\"price_team\"}"
STRIPE_PRICE_PLAN_MAP = "{\"price_plus\":\"plus\",\"price_pro\":\"pro\",\"price_team\":\"team\"}"
